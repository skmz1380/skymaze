<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Satellite orbiting animation">
  <defs>
    <style>
      @keyframes orbit-rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      @keyframes orbit-counter { from { transform: rotate(0deg); } to { transform: rotate(-360deg); } }
      @keyframes orbit-pulse { 0%,100% { opacity: 0.25; } 50% { opacity: 0.6; } }
      .orbit-spin { transform-origin: 100px 100px; animation: orbit-rotate 12s linear infinite; }
      .sat-counter { transform-origin: 100px 34px; animation: orbit-counter 12s linear infinite; }
      .core-glow { animation: orbit-pulse 3.5s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) {
        .orbit-spin, .sat-counter, .core-glow { animation: none; }
      }
    </style>
  </defs>

  <circle cx="100" cy="100" r="22" fill="none" stroke="#4f8cff" stroke-width="0.6" class="core-glow"/>
  <circle cx="100" cy="100" r="16" fill="#0d131e" stroke="#1a2332" stroke-width="1"/>
  <path d="M89,95 C94,91 106,91 111,95 M87,103 C94,107 106,107 113,103 M91,109 C95,112 105,112 109,109"
        fill="none" stroke="#626d80" stroke-width="0.7" opacity="0.7"/>

  <ellipse cx="100" cy="100" rx="66" ry="66" fill="none" stroke="#1a2332" stroke-width="0.5" stroke-dasharray="2 5"/>

  <g class="orbit-spin">
    <g transform="translate(100,34)">
      <g class="sat-counter">
        <rect x="-4" y="-4" width="8" height="8" rx="1" fill="#edf2fa"/>
        <rect x="-15" y="-1.5" width="10" height="3" fill="#4f8cff"/>
        <rect x="5" y="-1.5" width="10" height="3" fill="#4f8cff"/>
        <line x1="0" y1="-4" x2="0" y2="-10" stroke="#7ca9ff" stroke-width="0.7"/>
        <circle cx="0" cy="-11" r="1.1" fill="#7ca9ff"/>
      </g>
    </g>
  </g>
</svg>
